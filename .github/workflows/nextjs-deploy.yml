name: Deploy Next.js Static Page to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static Site
        run: npm run build
        # 1. [수정] 이 env 블록을 추가합니다.
        # 이렇게 하면 next.config.ts의 'process.env.NODE_ENV'가
        # 'production'이 되어 repoName이 '/twinkle-friend'로 설정됩니다.
        # ❗ 이것이 GitHub Pages에서 이미지가 보이지 않던 문제의 핵심 해결책입니다.
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
